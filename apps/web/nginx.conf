server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota desconhecida cai no index.html para o React Router
    # resolver. Sem isto, um F5 em /indicadores/usd-brl-ptax daria 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets tem hash no nome: podem ser cacheados agressivamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O index.html nunca: e ele que aponta para o hash novo apos um deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
