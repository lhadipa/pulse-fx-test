name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Estes testes nao precisam de banco nem de rede.
      - name: Unit tests
        run: npm test

  integration:
    name: Integration tests against PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse_fx_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pulse -d pulse_fx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Integration tests
        run: npm run test:integration --workspace @pulse-fx/api
        env:
          TEST_DATABASE_URL: postgresql://pulse:pulse@localhost:5433/pulse_fx_test

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Garante que o entregavel principal - `docker compose up` - nao quebra.
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t pulse-fx-api .

      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t pulse-fx-web .
